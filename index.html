<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ushinawa Kyuseishu Academy - ระบบแจ้งเตือน</title>
    <!-- ดึงฟอนต์ Noto Sans Thai จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif, Arial;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #110000;
            border: 2px solid #800517;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(128, 5, 23, 0.4);
            max-width: 500px;
            width: 100%;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #330000;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .school-title {
            font-size: 11px;
            color: #cc6666;
            letter-spacing: 1px;
        }
        .system-badge {
            background: #800517;
            color: #ffffff;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        h1 {
            color: #ff4d4d;
            margin: 0 0 15px 0;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
            font-size: 22px;
            font-weight: 700;
        }
        /* แถบเมนูด้านบน (Tabs) */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid #330000;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: #1a0505;
            color: #cc6666;
            border: 1px solid #330000;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Noto Sans Thai', sans-serif;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #660000;
            color: #ffffff;
            border-color: #800517;
            font-weight: 600;
        }
        /* กล่องประกาศสถานการณ์ */
        .alert-card {
            background: #1a0505;
            border-left: 5px solid #ff4d4d;
            border-top: 1px solid #330000;
            border-right: 1px solid #330000;
            border-bottom: 1px solid #330000;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .alert-tag {
            font-size: 11px;
            color: #ff4d4d;
            margin-bottom: 5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .alert-tag::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #ff4d4d;
            border-radius: 50%;
        }
        .alert-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .alert-desc {
            font-size: 13px;
            color: #d0d0d0;
            margin: 0;
            line-height: 1.5;
        }
        .footer {
            font-size: 11px;
            color: #777777;
            margin-top: 20px;
            border-top: 1px solid #220000;
            padding-top: 10px;
            text-align: center;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ส่วนหัวของระบบ -->
        <div class="header-top">
            <div class="school-title">USHINAWA ACADEMY</div>
            <div class="system-badge">SYSTEM</div>
        </div>

        <h1>ประกาศสถานการณ์</h1>

        <!-- แถบเมนูด้านบน (Tabs) -->
        <div class="nav-tabs">
            <button class="tab-btn active">🔴 ประกาศ</button>
            <button class="tab-btn">📋 รายงานเหตุ</button>
            <button class="tab-btn">🗂️ ข้อมูล</button>
        </div>
        
        <!-- เนื้อหาการแจ้งเตือน -->
        <div class="alert-card">
            <div class="alert-tag">เฝ้าระวัง • พื้นที่เขตหวงห้าม</div>
            <div class="alert-title">[แจ้งเตือน] รายงานเหตุผิดปกติในอาคารเรียน</div>
            <p class="alert-desc">ประกาศจากฝ่ายปกครองโรงเรียน: ตรวจพบความผิดปกติบริเวณเขตหอพัก ขอให้ลูกบ้านทุกท่านโปรดระมัดระวังและติดตามข่าวสารอย่างใกล้ชิด</p>
        </div>

        <div class="footer">
            ระบบแจ้งเตือนอัตโนมัติ • Ushinawa Kyuseishu
        </div>
    </div>
</body>
</html>
