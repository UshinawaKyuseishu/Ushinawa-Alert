<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ushinawa Kyuseishu Alert</title>
    <!-- ดึงฟอนต์ Noto Sans Thai จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif, Arial;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #110000;
            border: 2px solid #800517;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(128, 5, 23, 0.4);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #ff4d4d;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
            font-size: 24px;
            font-weight: 700;
        }
        .badge {
            background: #660000;
            color: #ffffff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #800517;
            font-weight: 600;
        }
        .alert-box {
            background: #1a0505;
            border-left: 5px solid #800517;
            border-top: 1px solid #330000;
            border-right: 1px solid #330000;
            border-bottom: 1px solid #330000;
            padding: 15px;
            text-align: left;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #f0f0f0;
            font-weight: 400;
        }
        .footer {
            font-size: 11px;
            color: #777777;
            margin-top: 20px;
            border-top: 1px solid #220000;
            padding-top: 10px;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ushinawa Kyuseishu Alert</h1>
        <div class="badge">📢 บอร์ดประกาศ & แจ้งเตือนหมู่บ้าน</div>
        
        <div class="alert-box">
            <strong>ประกาศสำคัญ:</strong>
            <p>ยินดีต้อนรับ ทุกคนสามารถรับรู้ข่าวสารภายในอุชินาวะ คิวเซชู ได้จากที่นี่</p>
        </div>

        <div class="footer">
            ระบบแจ้งเตือนอัตโนมัติ • GitHub & Netlify
        </div>
    </div>
</body>
</html>
